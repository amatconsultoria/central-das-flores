<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central das Flores</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,600;0,700;1,300&family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Jost:wght@200;300;400;500&display=swap">


<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: #E0D2EC;
    font-family: 'Jost', system-ui, sans-serif;
  }

  .card {
    width: 100%;
    max-width: 456px;
    background: #FFFFFF;
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    box-shadow:
      0 24px 72px rgba(123, 59, 122, 0.18),
      0 8px 24px rgba(123, 59, 122, 0.10),
      0 1px 4px rgba(0,0,0,0.06);
  }

  .bar-top {
    width: 100%;
    height: 3px;
    background: linear-gradient(to right, #C87098, #7B3B7A);
    flex-shrink: 0;
  }

  .card-body {
    flex: 1;
    padding: 44px 44px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: linear-gradient(165deg, #FFFFFF 55%, #FDF4FC 100%);
  }

  .logo-img {
    width: 180px;
    height: 180px;
    object-fit: contain;
    margin-bottom: 18px;
    filter: drop-shadow(0 3px 10px rgba(123, 59, 122, 0.13));
  }

  .brand {
    text-align: center;
    line-height: 1;
    margin-bottom: 12px;
  }

  .brand-main {
    display: block;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 25px;
    letter-spacing: 0.26em;
    color: #1C0A1C;
    text-transform: uppercase;
  }

  .brand-das {
    display: block;
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    font-style: italic;
    font-size: 12px;
    letter-spacing: 0.5em;
    color: #A882B0;
    margin: 5px 0 4px;
  }

  .slogan {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-weight: 300;
    font-size: 15px;
    letter-spacing: 0.14em;
    color: #C87098;
    margin-bottom: 26px;
  }


  .role-tag {
    display: block;
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    font-size: 10px;
    letter-spacing: 0.25em;
    color: #A882B0;
    text-transform: uppercase;
    margin-top: 3px;
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 68%;
    margin-bottom: 20px;
  }

  .div-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(200,112,152,0.45));
  }
  .div-line.r {
    background: linear-gradient(to left, transparent, rgba(123,59,122,0.45));
  }
  .div-gem {
    width: 5px;
    height: 5px;
    transform: rotate(45deg);
    background: linear-gradient(135deg, #C87098, #7B3B7A);
    flex-shrink: 0;
  }

  .owner {
    text-align: center;
    margin-bottom: 24px;
  }

  .owner-name {
    font-family: 'Montserrat', sans-serif;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 0.26em;
    color: #3A1A3A;
    text-transform: uppercase;
  }

  /* ── MAIN CONTENT ROW: contacts + QR ── */
  .content-row {
    width: 100%;
    display: flex;
    align-items: flex-start;
    gap: 24px;
    margin-bottom: 30px;
  }

  .contacts {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 13px;
  }

  .contact { cursor: pointer; }
  .contact a { display: contents; }
  .contact {
    display: flex;
    align-items: flex-start;
    gap: 11px;
  }

  .c-icon {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .c-body { flex: 1; min-width: 0; }

  .c-label {
    display: block;
    font-family: 'Jost', sans-serif;
    font-weight: 500;
    font-size: 7.5px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: #C87098;
    margin-bottom: 1px;
  }

  .c-value {
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    font-size: 11.5px;
    color: #3A1A3A;
    line-height: 1.55;
    word-break: break-word;
  }

  /* ── QR CODE BLOCK ── */
  .qr-block {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .qr-frame {
    width: 96px;
    height: 96px;
    padding: 6px;
    border-radius: 10px;
    background: #FFFFFF;
    border: 1px solid rgba(200,112,152,0.25);
    box-shadow: 0 2px 10px rgba(123,59,122,0.10);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* qrcodejs injects a canvas or img inside #qrcode */
  #qrcode canvas,
  #qrcode img {
    border-radius: 4px;
    display: block;
  }

  .qr-label {
    font-family: 'Jost', sans-serif;
    font-weight: 400;
    font-size: 7.5px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #A882B0;
    text-align: center;
  }

  /* ── FOOTER ── */
  .card-footer {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .foot-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(200,112,152,0.22));
  }
  .foot-line.r {
    background: linear-gradient(to left, transparent, rgba(123,59,122,0.22));
  }
  .foot-center {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .foot-dot {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: linear-gradient(135deg, #C87098, #7B3B7A);
  }
  .foot-bar {
    width: 20px;
    height: 1px;
    background: linear-gradient(to right, #C87098, #7B3B7A);
  }

  .bar-bottom {
    width: 100%;
    height: 2px;
    background: linear-gradient(to right, #7B3B7A, #C87098);
    flex-shrink: 0;
  }

  @media (max-width: 600px) {
    body { padding: 0; align-items: stretch; min-height: 100vh; }
    .card { max-width: 100%; width: 100%; border-radius: 0; min-height: 100vh; }
    .card-body { padding: 36px 32px 32px; }
    .logo-img { width: 160px; height: 160px; margin-bottom: 16px; }
    .brand-main { font-size: 22px; letter-spacing: 0.2em; }
    .brand-das { font-size: 11px; }
    .slogan { font-size: 14px; }
    .owner { font-size: 13px; }
    .c-value { font-size: 13px; }
  
  .role-tag {
    display: block;
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    font-size: 10px;
    letter-spacing: 0.25em;
    color: #A882B0;
    text-transform: uppercase;
    margin-top: 3px;
  }
  .divider { margin: 18px 0; }
    .content-row { gap: 16px; }
    .qr-frame { width: 90px; height: 90px; }
    .qr-frame img { width: 78px !important; height: 78px !important; }
    .qr-label { font-size: 9px; }
  }
</style>
